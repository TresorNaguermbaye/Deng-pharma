version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: deng_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: deng_pharma_db
      POSTGRES_USER: deng_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deng_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deng_network

  redis:
    image: redis:7-alpine
    container_name: deng_redis
    ports:
      - "6379:6379"
    networks:
      - deng_network

  backend:
    build: ./backend
    container_name: deng_backend
    command: gunicorn --workers 3 config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=0
      - DATABASE_URL=postgresql://deng_user:${DB_PASSWORD}@db:5432/deng_pharma_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deng_network

  celery-worker:
    build: ./backend
    container_name: deng_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=0
      - DATABASE_URL=postgresql://deng_user:${DB_PASSWORD}@db:5432/deng_pharma_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - deng_network

  celery-beat:
    build: ./backend
    container_name: deng_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=0
      - DATABASE_URL=postgresql://deng_user:${DB_PASSWORD}@db:5432/deng_pharma_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - deng_network

  ai-service:
    build: ./ai_service
    container_name: deng_ai_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    volumes:
      - ./ai_service:/app
    environment:
      - MODEL_PATH=/app/models
    ports:
      - "8001:8001"
    networks:
      - deng_network

  frontend:
    build: ./frontend
    container_name: deng_frontend
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API_URL=${FRONTEND_API_URL}
      - NEXT_PUBLIC_APP_URL=${FRONTEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - deng_network

  nginx:
    image: nginx:alpine
    container_name: deng_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - ai-service
    networks:
      - deng_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  deng_network:
    driver: bridge